<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 20 950 340" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Noto Sans Thai', 'Sarabun', 'Segoe UI', Tahoma, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 L 2 5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="120" y="20" width="950" height="340" fill="#ffffff" />

  <!-- Title -->
  <text x="585" y="65" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">Data Flow Diagram Level 0 (Context Diagram)</text>

  <!-- External Entity: ผู้ใช้ทั่วไป -->
  <rect x="160" y="142" width="100" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="210" y="167" text-anchor="middle" font-size="12" fill="#000000">ผู้ใช้ทั่วไป</text>

  <!-- Process 0.0 (Gane & Sarson style) -->
  <rect x="503" y="134" width="126" height="200" rx="14" ry="14" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="503" y1="156" x2="629" y2="156" stroke="#000000" stroke-width="1.2" />
  <text x="566" y="150" text-anchor="middle" font-size="12" fill="#000000">0.0</text>
  <text x="566" y="238" text-anchor="middle" font-size="12" fill="#000000">ระบบ Short URL และ</text>
  <text x="566" y="255" text-anchor="middle" font-size="12" fill="#000000">จัดการสถิติ</text>

  <!-- Data Store D1: urls (Gane & Sarson open-right rectangle) -->
  <path d="M 1030 139 L 850 139 L 850 179 L 1030 179" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="880" y1="139" x2="880" y2="179" stroke="#000000" stroke-width="1.2" />
  <text x="865" y="164" text-anchor="middle" font-size="12" fill="#000000">D1</text>
  <text x="945" y="164" text-anchor="middle" font-size="12" fill="#000000">urls</text>

  <!-- Data Store D2: click_logs (Gane & Sarson open-right rectangle) -->
  <path d="M 1030 222 L 850 222 L 850 262 L 1030 262" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="880" y1="222" x2="880" y2="262" stroke="#000000" stroke-width="1.2" />
  <text x="865" y="247" text-anchor="middle" font-size="12" fill="#000000">D2</text>
  <text x="945" y="247" text-anchor="middle" font-size="12" fill="#000000">click_logs</text>

  <!-- Left Flows: ผู้ใช้ทั่วไป <-> 0.0 -->
  <!-- 1. ข้อมูล Full URL / Custom Alias / วันหมดอายุ -->
  <line x1="260" y1="152" x2="501" y2="152" stroke="#000000" stroke-width="1.1" marker-end="url(#arrow)" />
  <text x="382" y="145" text-anchor="middle" font-size="11" fill="#000000">ข้อมูล Full URL / Custom Alias / วันหมดอายุ</text>

  <!-- 2. ผลลัพธ์ Short URL และรูปภาพ QR Code -->
  <line x1="503" y1="172" x2="262" y2="172" stroke="#000000" stroke-width="1.1" marker-end="url(#arrow)" />
  <text x="382" y="166" text-anchor="middle" font-size="11" fill="#000000">ผลลัพธ์ Short URL และรูปภาพ QR Code</text>

  <!-- 3. เปิดลิงก์ Short URL / สแกน QR Code -->
  <polyline points="235,182 235,213 501,213" fill="none" stroke="#000000" stroke-width="1.1" marker-end="url(#arrow)" />
  <text x="375" y="207" text-anchor="middle" font-size="11" fill="#000000">เปิดลิงก์ Short URL / สแกน QR Code</text>

  <!-- 4. HTTP 302 Redirect ไปยัง URL ปลายทางจริง -->
  <polyline points="503,250 219,250 219,184" fill="none" stroke="#000000" stroke-width="1.1" marker-end="url(#arrow)" />
  <text x="375" y="243" text-anchor="middle" font-size="11" fill="#000000">HTTP 302 Redirect ไปยัง URL ปลายทางจริง</text>

  <!-- 5. คำขอเรียกดูประวัติและสถิติการใช้งาน -->
  <polyline points="202,182 202,284 501,284" fill="none" stroke="#000000" stroke-width="1.1" marker-end="url(#arrow)" />
  <text x="370" y="278" text-anchor="middle" font-size="11" fill="#000000">คำขอเรียกดูประวัติและสถิติการใช้งาน</text>

  <!-- 6. รายการประวัติ URL และจำนวนคลิก -->
  <polyline points="503,319 185,319 185,184" fill="none" stroke="#000000" stroke-width="1.1" marker-end="url(#arrow)" />
  <text x="370" y="312" text-anchor="middle" font-size="11" fill="#000000">รายการประวัติ URL และจำนวนคลิก</text>

  <!-- Right Flows: 0.0 <-> D1 (urls) -->
  <!-- 7. บันทึกข้อมูล URL -->
  <line x1="629" y1="142" x2="848" y2="142" stroke="#000000" stroke-width="1.1" marker-end="url(#arrow)" />
  <text x="740" y="135" text-anchor="middle" font-size="11" fill="#000000">บันทึกข้อมูล URL</text>

  <!-- 8. ค้นหา Full URL / รายการ URL ทั้งหมด -->
  <line x1="850" y1="172" x2="631" y2="172" stroke="#000000" stroke-width="1.1" marker-end="url(#arrow)" />
  <text x="740" y="165" text-anchor="middle" font-size="11" fill="#000000">ค้นหา Full URL / รายการ URL ทั้งหมด</text>

  <!-- Right Flows: 0.0 <-> D2 (click_logs) -->
  <!-- 9. บันทึกประวัติการคลิก -->
  <line x1="629" y1="227" x2="848" y2="227" stroke="#000000" stroke-width="1.1" marker-end="url(#arrow)" />
  <text x="740" y="220" text-anchor="middle" font-size="11" fill="#000000">บันทึกประวัติการคลิก</text>

  <!-- 10. ข้อมูลสถิติการคลิก -->
  <line x1="850" y1="257" x2="631" y2="257" stroke="#000000" stroke-width="1.1" marker-end="url(#arrow)" />
  <text x="740" y="250" text-anchor="middle" font-size="11" fill="#000000">ข้อมูลสถิติการคลิก</text>
</svg>
