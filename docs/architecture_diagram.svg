<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 15 1170 505" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Noto Sans Thai', 'Sarabun', 'Segoe UI', Tahoma, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 L 2 5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="30" y="15" width="1170" height="505" fill="#ffffff" />

  <!-- Title -->
  <text x="615" y="55" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">Microservice &amp; Layered Architecture Diagram</text>

  <!-- 1. Client Layer -->
  <rect x="60" y="250" width="170" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.4" />
  <text x="145" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Client Layer (Frontend)</text>
  <text x="145" y="300" text-anchor="middle" font-size="11.5" fill="#000000">Web Browser / Mobile</text>
  <text x="145" y="320" text-anchor="middle" font-size="11" fill="#334155">(Vue 3 / Nuxt App)</text>

  <!-- Arrow: Client <-> API Gateway -->
  <line x1="232" y1="295" x2="298" y2="295" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="265" y="286" text-anchor="middle" font-size="10.5" fill="#000000">HTTP / REST</text>

  <!-- 2. API Gateway & Router -->
  <rect x="300" y="205" width="190" height="180" fill="#ffffff" stroke="#000000" stroke-width="1.4" />
  <line x1="300" y1="250" x2="490" y2="250" stroke="#000000" stroke-width="1" />
  <text x="395" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">API Gateway &amp; Router</text>
  <text x="395" y="242" text-anchor="middle" font-size="11" fill="#334155">(Controller Layer)</text>
  <text x="315" y="275" font-size="11" fill="#000000">• POST /api/shorten</text>
  <text x="315" y="297" font-size="11" fill="#000000">• GET /api/urls</text>
  <text x="315" y="319" font-size="11" fill="#000000">• DELETE /api/urls/:id</text>
  <text x="315" y="341" font-size="11" fill="#000000">• GET /api/urls/:id/logs</text>
  <text x="315" y="363" font-size="11" fill="#000000">• GET /:code (302 Redirect)</text>

  <!-- 3. Microservices Layer Container -->
  <rect x="555" y="95" width="245" height="395" fill="#fafafa" stroke="#000000" stroke-width="1.4" />
  <rect x="555" y="95" width="245" height="32" fill="#ffffff" stroke="#000000" stroke-width="1.4" />
  <text x="677.5" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">Microservices Layer (Services)</text>

  <!-- Service 1: Shortener Service -->
  <rect x="575" y="148" width="205" height="86" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="677.5" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">1. Shortener Service</text>
  <text x="677.5" y="191" text-anchor="middle" font-size="11" fill="#334155">(shortener.service.ts)</text>
  <text x="677.5" y="212" text-anchor="middle" font-size="10.5" fill="#000000">สร้างลิงก์สั้น / QR Code / จัดการลิงก์</text>

  <!-- Service 2: Redirect Service -->
  <rect x="575" y="262" width="205" height="86" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="677.5" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">2. Redirect Service</text>
  <text x="677.5" y="305" text-anchor="middle" font-size="11" fill="#334155">(redirect.service.ts)</text>
  <text x="677.5" y="326" text-anchor="middle" font-size="10.5" fill="#000000">ค้นหารหัสย่อ / เช็ควันหมดอายุ / 302</text>

  <!-- Service 3: Analytics Service -->
  <rect x="575" y="382" width="205" height="86" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="677.5" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">3. Analytics Service</text>
  <text x="677.5" y="425" text-anchor="middle" font-size="11" fill="#334155">(analytics.service.ts)</text>
  <text x="677.5" y="446" text-anchor="middle" font-size="10.5" fill="#000000">นับจำนวนคลิก / บันทึก Click Logs</text>

  <!-- Internal Event: Redirect Service -> Analytics Service -->
  <line x1="677.5" y1="348" x2="677.5" y2="380" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="720" y="368" text-anchor="middle" font-size="10" fill="#000000">Async Track</text>

  <!-- Arrows: API Gateway -> Microservices -->
  <polyline points="490,260 525,260 525,191 573,191" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="490" y1="305" x2="573" y2="305" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <polyline points="490,345 525,345 525,425 573,425" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 4. Repository Layer -->
  <rect x="855" y="210" width="155" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
  <text x="932.5" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">URL Repository</text>
  <text x="932.5" y="262" text-anchor="middle" font-size="11" fill="#334155">(url.repository.ts)</text>

  <rect x="855" y="389" width="155" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
  <text x="932.5" y="421" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Analytics Repository</text>
  <text x="932.5" y="441" text-anchor="middle" font-size="11" fill="#334155">(analytics.repository.ts)</text>

  <!-- Arrows: Microservices -> Repositories -->
  <polyline points="780,191 825,191 825,235 853,235" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <polyline points="780,305 825,305 825,258 853,258" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="780" y1="425" x2="853" y2="425" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- 5. Database Layer (Cylinders) -->
  <!-- Cylinder 1: urls -->
  <path d="M 1060 218 C 1060 208, 1175 208, 1175 218 L 1175 276 C 1175 286, 1060 286, 1060 276 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
  <ellipse cx="1117.5" cy="218" rx="57.5" ry="9" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
  <text x="1117.5" y="249" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">D1: urls</text>
  <text x="1117.5" y="266" text-anchor="middle" font-size="10.5" fill="#334155">(MySQL TiDB)</text>

  <!-- Cylinder 2: click_logs -->
  <path d="M 1060 397 C 1060 387, 1175 387, 1175 397 L 1175 455 C 1175 465, 1060 465, 1060 455 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
  <ellipse cx="1117.5" cy="397" rx="57.5" ry="9" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
  <text x="1117.5" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">D2: click_logs</text>
  <text x="1117.5" y="445" text-anchor="middle" font-size="10.5" fill="#334155">(MySQL TiDB)</text>

  <!-- Arrows: Repositories <-> Databases -->
  <line x1="1012" y1="246" x2="1058" y2="246" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="1012" y1="425" x2="1058" y2="425" stroke="#000000" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
</svg>
